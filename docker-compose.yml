services:
  postgres:
    image: postgres:15-alpine # 使用PostgreSQL 15的轻量版镜像
    environment:
      POSTGRES_USER: ${DB_USER}         # 从 .env 读取数据库用户名
      POSTGRES_PASSWORD: ${DB_PASSWORD} # 从 .env 读取数据库密码
      POSTGRES_DB: ${DB_NAME}           # 从 .env 读取数据库名
    ports:
      - "5432:5432" # 将容器的5432端口映射到本机的5432端口
    volumes:
      - postgres_data:/var/lib/postgresql/data # 持久化数据，防止容器删除后数据丢失

volumes:
  postgres_data:
